name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Application
        run: pnpm build

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./config/version.json').applicationVersion")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Package Release Bundle
        shell: bash
        run: |
          mkdir -p release-bundle
          cp -r dist release-bundle/
          cp -r server-dist release-bundle/
          cp -r migrations release-bundle/
          cp -r config release-bundle/
          cp package.json release-bundle/
          cp pnpm-lock.yaml release-bundle/
          if [ -d "patches" ]; then cp -r patches release-bundle/; fi

          cd release-bundle
          zip -r ../isra-pos-update.zip .
          cd ..
          sha256sum isra-pos-update.zip > isra-pos-update.zip.sha256

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            isra-pos-update.zip
            isra-pos-update.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
